<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangilik Qo'shish (Admin)</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F9FAFB;
            --card: #FFFFFF;
            --text: #1F2937;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #9CA3AF;
            cursor: not-allowed;
        }

        .result {
            margin-top: 24px;
            padding: 16px;
            background: #F3F4F6;
            border-radius: 8px;
            display: none;
        }

        .result h3 {
            margin-top: 0;
            font-size: 16px;
            color: #111827;
        }

        textarea.code-output {
            height: 250px;
            font-family: monospace;
            background: #111827;
            color: #10B981;
            resize: none;
        }

        .copy-btn {
            margin-top: 10px;
            background: #10B981;
        }

        .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .lock-box {
            background: #1F2937;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .lock-box h2 {
            color: #F9FAFB;
            margin-top: 0;
        }

        .lock-box input {
            background: #374151;
            color: white;
            border: 1px solid #4B5563;
            margin-bottom: 20px;
            text-align: center;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .lock-box input::placeholder {
            color: #9CA3AF;
            letter-spacing: 0;
        }

        .lock-box button {
            background: #10B981;
        }
    </style>
</head>

<body>

    <!-- QULF EKRAN -->
    <div class="lock-screen" id="lockScreen">
        <div class="lock-box">
            <h2>🔒 Admin Panel</h2>
            <p style="color: #9CA3AF; font-size: 14px; margin-bottom: 20px;">Xavfsizlik uchun parolni kiriting</p>
            <input type="password" id="passInput" placeholder="Parol">
            <button onclick="checkPass()">Kirish</button>
            <p id="passError" style="color: #EF4444; font-size: 14px; display: none; margin-top: 15px;">❌ Parol xato!
            </p>
        </div>
    </div>

    <!-- ASOSIY ADMIN PANEL -->
    <div class="admin-container" id="mainContent" style="display: none;">
        <h1>Yangilik Qo'shish (ImgBB)</h1>
        <form id="newsForm">
            <div class="form-group">
                <label>Sarlavha (Title)</label>
                <input type="text" id="title" required placeholder="Masalan: Yangi tanlov g'oliblari aniqlandi">
            </div>

            <div class="form-group">
                <label>Rasm yuklash</label>
                <input type="file" id="imageFile" accept="image/*" required>
            </div>

            <div class="form-group">
                <label>Teg (Kategoriya)</label>
                <input type="text" id="tag" required placeholder="Masalan: Yutuqlar">
            </div>

            <div class="form-group">
                <label>Sana</label>
                <input type="text" id="date" required placeholder="Kk.Oo.Yyyy">
            </div>

            <div class="form-group">
                <label>Matn (Content)</label>
                <textarea id="content" rows="4" required placeholder="Yangilik haqida to'liq ma'lumot..."></textarea>
            </div>

            <button type="submit" id="submitBtn">Yangi yangilikni saqlash</button>
        </form>

        <div class="result" id="resultBox">
            <h3 style="color: #10B981;">✅ Zo'r! Yangilik saytga avtomat qo'shildi!</h3>
            <p style="font-size: 14px;">Endi <a href="index.html" target="_blank">Asosiy saytga</a> o'tib natijani
                ko'rishingiz mumkin.</p>
        </div>
    </div>

    <script>
        // PAROL TEKSHIRISH (Kriptografik shifrlangan holat)
        // Parolingiz "Texnikum3son2026"
        // Agar o'zgartirmoqchi bo'lsangiz, uni Base64 da shifrlab btoa('yangi parol') deb console'dan olib bu yerga qo'yasiz.
        const ADMIN_PASS_HASH = "VGV4bmlrdW0zc29uMjAyNg==";

        function checkPass() {
            const input = document.getElementById('passInput').value;
            if (btoa(input) === ADMIN_PASS_HASH) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } else {
                document.getElementById('passError').style.display = 'block';
                setTimeout(() => document.getElementById('passError').style.display = 'none', 2000);
            }
        }

        // Enter bosilganda ham ishlashi uchun
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPass();
        });

        // Dasturchiga API KEYni o'zgartirishi kerak
        const IMGBB_API_KEY = "6f151d36cce3b1198b9685d8cb0f47a4"; // O'zingizning API kalitingizni shu yerga qo'ying yoki tekin kalit ishlatavering.

        // Bugungi sanani avtomat qoyish
        const today = new Date();
        document.getElementById('date').value =
            String(today.getDate()).padStart(2, '0') + '.' +
            String(today.getMonth() + 1).padStart(2, '0') + '.' +
            today.getFullYear();

        document.getElementById('newsForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('imageFile');
            if (fileInput.files.length === 0) return alert("Rasmni tanlang!");

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('image', file);

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Yuklanmoqda. Iltimos kuting...";
            submitBtn.disabled = true;

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    const imageUrl = data.data.url;

                    const title = document.getElementById('title').value;
                    const tag = document.getElementById('tag').value;
                    const date = document.getElementById('date').value;
                    const content = document.getElementById('content').value;

                    const newObj = { title, tag, date, content, imageUrl };

                    // MOCKAPI GA YULLASH (GLOBAL)
                    const MOCK_API = "https://shu-yerga-mockapi-linkini-yozasiz.mockapi.io/news"; // <=== MOCKAPI LINKINI SHU YERGA QO'YING!

                    fetch(MOCK_API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newObj)
                    }).then(res => {
                        if (res.ok) {
                            document.getElementById('resultBox').style.display = 'block';
                            document.getElementById('newsForm').reset();
                            document.getElementById('date').value =
                                String(today.getDate()).padStart(2, '0') + '.' +
                                String(today.getMonth() + 1).padStart(2, '0') + '.' +
                                today.getFullYear();
                        } else {
                            alert("Baza (MockAPI) linki to'g'ri qo'yilganiga ishonch hosil qiling!");
                        }
                    }).catch(error => {
                        alert("Bazaga ulanishda xatolik: " + error);
                    });

                } else {
                    alert("Xato yuz berdi: " + data.error.message);
                }
            } catch (err) {
                alert("Internet aloqasini tekshiring yoki API kalitni to'g'rilang!");
                console.error(err);
            } finally {
                submitBtn.innerText = "Yangi yangilikni saqlash";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
